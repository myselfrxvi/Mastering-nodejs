<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevVault — Developer Snippet & Secrets Manager</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --success: #3fb950;
      --danger: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
    header h1 { font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    
    .btn { background: var(--border); color: #fff; border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
    .btn:hover { background: #21262d; border-color: var(--accent); }
    .btn-primary { background: #238636; border-color: #2ea043; }
    .btn-primary:hover { background: #2ea043; }
    .btn-danger { background: rgba(248, 81, 73, 0.15); color: var(--danger); border-color: rgba(248, 81, 73, 0.4); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea { width: 100%; background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 0.6rem; border-radius: 6px; font-size: 0.95rem; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
    textarea { font-family: "Fira Code", monospace; min-height: 120px; resize: vertical; }

    .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }

    .snippet-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
    .snippet-header { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; background: #1c2128; border-bottom: 1px solid var(--border); }
    .snippet-title { font-weight: 600; color: #fff; }
    .badge { background: #21262d; border: 1px solid var(--border); color: var(--accent); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 20px; }
    pre { background: #0d1117; padding: 1rem; overflow-x: auto; font-size: 0.9rem; color: #79c0ff; line-height: 1.4; }

    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .hidden { display: none !important; }
    .alert { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-error { background: rgba(248, 81, 73, 0.15); border: 1px solid var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗄️ DevVault</h1>
      <div id="userSection" class="hidden">
        <span id="welcomeUser" style="margin-right: 1rem; color: var(--text-muted);"></span>
        <a id="exportBtn" class="btn" style="text-decoration: none; display: inline-block;">📥 Export (.md)</a>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </header>

    <!-- AUTHENTICATION VIEW -->
    <div id="authView" class="card" style="max-width: 450px; margin: 3rem auto;">
      <div class="tabs">
        <div id="tabLogin" class="tab active" onclick="switchAuthTab('login')">Login</div>
        <div id="tabRegister" class="tab" onclick="switchAuthTab('register')">Register</div>
      </div>

      <div id="authError" class="alert alert-error hidden"></div>

      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="authUsername" required placeholder="e.g. brucewayne">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••••••">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </div>

    <!-- MAIN DASHBOARD (HIDDEN UNTIL LOGIN) -->
    <div id="dashboardView" class="hidden">
      <!-- CREATE SNIPPET FORM -->
      <div class="card">
        <h3 style="margin-bottom: 1rem; color: #fff;">+ Add New Code Snippet</h3>
        <form onsubmit="handleCreateSnippet(event)">
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="snippetTitle" placeholder="e.g. Express Auth Middleware" required>
            </div>
            <div class="form-group">
              <label>Language</label>
              <select id="snippetLanguage">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="rust">Rust</option>
                <option value="sql">SQL</option>
                <option value="json">JSON</option>
                <option value="bash">Bash</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Tags (Comma-separated)</label>
            <input type="text" id="snippetTags" placeholder="e.g. node, express, security">
          </div>
          <div class="form-group">
            <label>Code Snippet</label>
            <textarea id="snippetCode" placeholder="// Write or paste your code here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save to Vault</button>
        </form>
      </div>

      <!-- SEARCH & FILTER -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by title, tag, or code..." oninput="handleSearch()">
      </div>

      <!-- SNIPPET LIST -->
      <div id="snippetsList"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http') ? '' : 'http://localhost:8080';
    let currentMode = 'login';
    let token = localStorage.getItem('devvault_token');
    let username = localStorage.getItem('devvault_username');

    if (token) showDashboard();

    function switchAuthTab(mode) {
      currentMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('authError').classList.add('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const u = document.getElementById('authUsername').value;
      const p = document.getElementById('authPassword').value;
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');

      const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/register';
      try {
        const res = await fetch(API_BASE + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        
        let data;
        try {
          data = await res.json();
        } catch (jsonErr) {
          throw new Error('Cannot reach Node.js! Make sure "npm run devvault" is running in terminal and you opened http://localhost:8080 (not file:///)');
        }

        if (!res.ok) throw new Error(data.error || 'Authentication failed');

        token = data.token;
        username = data.username || u;
        localStorage.setItem('devvault_token', token);
        localStorage.setItem('devvault_username', username);
        showDashboard();
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('userSection').classList.remove('hidden');
      document.getElementById('welcomeUser').textContent = `Logged in as @${username}`;
      
      // Update export button link with auth bearer header via fetch
      document.getElementById('exportBtn').onclick = downloadMarkdown;
      document.getElementById('logoutBtn').onclick = () => {
        localStorage.clear();
        location.reload();
      };
      loadSnippets();
    }

    async function loadSnippets(search = '') {
      const url = search ? `/api/snippets?search=${encodeURIComponent(search)}` : '/api/snippets';
      const res = await fetch(API_BASE + url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById('snippetsList');

      if (!data.snippets || data.snippets.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No snippets found in your vault. Create your first one above!</div>';
        return;
      }

      list.innerHTML = data.snippets.map(s => `
        <div class="snippet-card">
          <div class="snippet-header">
            <div>
              <span class="snippet-title">${escapeHtml(s.title)}</span>
              <span class="badge" style="margin-left: 0.5rem;">${escapeHtml(s.language)}</span>
              ${s.tags ? s.tags.split(',').map(t => `<span class="badge" style="margin-left: 0.2rem; color: #a371f7;">#${escapeHtml(t.trim())}</span>`).join('') : ''}
            </div>
            <button class="btn btn-danger" onclick="deleteSnippet(${s.id})">Delete</button>
          </div>
          <pre><code>${escapeHtml(s.code)}</code></pre>
        </div>
      `).join('');
    }

    async function handleCreateSnippet(e) {
      e.preventDefault();
      const title = document.getElementById('snippetTitle').value;
      const language = document.getElementById('snippetLanguage').value;
      const tags = document.getElementById('snippetTags').value;
      const code = document.getElementById('snippetCode').value;

      await fetch(API_BASE + '/api/snippets', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ title, language, tags, code })
      });

      document.getElementById('snippetTitle').value = '';
      document.getElementById('snippetTags').value = '';
      document.getElementById('snippetCode').value = '';
      loadSnippets();
    }

    async function deleteSnippet(id) {
      if (!confirm('Are you sure you want to delete this snippet?')) return;
      await fetch(API_BASE + `/api/snippets/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadSnippets();
    }

    let searchTimeout;
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadSnippets(document.getElementById('searchInput').value);
      }, 300);
    }

    async function downloadMarkdown() {
      const res = await fetch(API_BASE + '/api/snippets/export/markdown', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'devvault-export.md';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
